<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Check in</title>
<script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js"></script>
<style>
  :root {
    --ink:      #12161c;
    --panel:    #1b212b;
    --line:     #2b3442;
    --text:     #e6ebf2;
    --dim:      #8b97a8;
    --good:     #4ade80;
    --marginal: #fbbf24;
    --bad:      #f87171;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); color: var(--text); }
  body {
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px 18px 48px;
    max-width: 560px;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 22px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 14px;
  }
  .stage { font-size: 13px; color: var(--dim); margin-bottom: 6px; }
  .headline { font-size: 21px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 4px; }
  .note { font-size: 13px; color: var(--dim); }
  .good     { color: var(--good); }
  .marginal { color: var(--marginal); }
  .bad      { color: var(--bad); }

  button {
    width: 100%;
    padding: 15px;
    font: 600 16px/1 inherit;
    color: var(--ink);
    background: var(--text);
    border: 0;
    border-radius: 9px;
    cursor: pointer;
  }
  button:active { opacity: .8; }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible { outline: 2px solid var(--good); outline-offset: 2px; }

  fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin: 22px 0 0; }
  legend { color: var(--dim); font-size: 13px; padding: 0 6px; }
  label { display: block; font-size: 13px; color: var(--dim); margin: 12px 0 4px; }
  input[type=url], input[type=text] {
    width: 100%;
    padding: 10px 12px;
    font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--text);
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: 7px;
  }
  input:focus-visible { outline: 2px solid var(--good); outline-offset: 1px; }
  .check { display: flex; align-items: center; gap: 9px; margin-top: 14px; font-size: 13px; color: var(--dim); }
  .check input { width: 17px; height: 17px; accent-color: var(--good); }

  pre {
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 13px;
    margin: 14px 0 0;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 320px;
    overflow: auto;
  }
  .grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 7px 16px;
    font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    margin-top: 16px; padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .grid dt { color: var(--dim); }
  .grid dd { margin: 0; word-break: break-all; }
</style>
</head>
<body>

<h1>Check in</h1>
<p class="sub">Reads your location, then posts it to the flow.</p>

<div class="panel">
  <div class="stage" id="stage">Ready</div>
  <div class="headline" id="headline">Not checked in</div>
  <div class="note" id="note">Paste your flow URL below, then tap check in.</div>

  <dl class="grid" id="detail" hidden>
    <dt>source</dt><dd id="d-source">—</dd>
    <dt>lat</dt><dd id="d-lat">—</dd>
    <dt>lon</dt><dd id="d-lon">—</dd>
    <dt>accuracy</dt><dd id="d-acc">—</dd>
    <dt>round trip</dt><dd id="d-ms">—</dd>
  </dl>
</div>

<button id="btn">Check in</button>

<pre id="log" hidden></pre>

<fieldset>
  <legend>Test settings</legend>

  <label for="url">Flow URL</label>
  <input id="url" type="url" placeholder="https://prod-00.westeurope.logic.azure.com/workflows/...">

  <label for="email">Email to send</label>
  <input id="email" type="text" placeholder="you@bpsme.com">

  <label class="check">
    <input type="checkbox" id="asjson">
    Send as application/json (triggers a CORS preflight)
  </label>

  <p class="note" style="margin-top:14px">
    Nothing here is saved. Re-enter after a reload.
  </p>
</fieldset>

<script>
const $ = id => document.getElementById(id);
const MAX_ACCURACY = 100;
let inTeams = false;

microsoftTeams.app.initialize()
  .then(() => { inTeams = true; $('stage').textContent = 'Teams SDK ready'; })
  .catch(() => { $('stage').textContent = 'Running outside Teams'; });

$('btn').addEventListener('click', checkIn);

async function checkIn() {
  const url = $('url').value.trim();
  if (!url) { fail('No flow URL', 'Paste the flow URL in the settings below.'); return; }

  const btn = $('btn');
  btn.disabled = true;
  btn.textContent = 'Locating…';
  $('log').hidden = true;
  $('stage').textContent = 'Getting location';
  $('headline').textContent = 'Locating';
  $('headline').className = 'headline';
  $('note').textContent = 'This can take a few seconds.';

  let fix;
  try {
    fix = await getFix();
  } catch (e) {
    fail('No location', String(e.message || e));
    reset(btn); return;
  }

  const acc = Math.round(fix.acc);
  $('detail').hidden = false;
  $('d-source').textContent = fix.src;
  $('d-lat').textContent = fix.lat.toFixed(6);
  $('d-lon').textContent = fix.lon.toFixed(6);
  $('d-acc').innerHTML = '<span class="' + accClass(acc) + '">' + acc + ' m</span>';
  $('d-ms').textContent = '—';

  if (acc > MAX_ACCURACY) {
    fail('Location too vague',
         'Accurate to only ' + acc + ' m. Move near a window or step outside and try again.');
    reset(btn); return;
  }

  btn.textContent = 'Sending…';
  $('stage').textContent = 'Posting to flow';
  $('note').textContent = 'Waiting for a response.';

  const payload = {
    lat: fix.lat,
    lon: fix.lon,
    accuracy: acc,
    email: $('email').value.trim(),
    action: 'checkin'
  };

  const started = performance.now();
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': $('asjson').checked ? 'application/json' : 'text/plain' },
      body: JSON.stringify(payload)
    });
    const ms = Math.round(performance.now() - started);
    const text = await res.text();
    $('d-ms').textContent = ms + ' ms';

    if (!res.ok) {
      fail('Flow returned ' + res.status, res.statusText || 'See the response below.');
      show('HTTP ' + res.status + '\n\n' + (text || '(empty body)'));
    } else {
      $('stage').textContent = 'Done';
      $('headline').textContent = 'Flow responded';
      $('headline').className = 'headline good';
      $('note').textContent = 'HTTP ' + res.status + ' in ' + ms + ' ms.';
      show(text || '(empty body — did you add a Response action?)');
    }
  } catch (e) {
    const ms = Math.round(performance.now() - started);
    $('d-ms').textContent = ms + ' ms';
    fail('Request blocked', 'Usually CORS. See below.');
    show('fetch failed after ' + ms + ' ms\n\n' + String(e.message || e) +
         '\n\nIf this says "Failed to fetch", the browser blocked it before the flow ' +
         'was reached. Try unticking application/json, and add an ' +
         'Access-Control-Allow-Origin: * header to the flow\'s Response action.' +
         '\n\nPayload that would have been sent:\n' + JSON.stringify(payload, null, 2));
  }
  reset(btn);
}

async function getFix() {
  try {
    const loc = await microsoftTeams.geoLocation.getCurrentLocation();
    return { lat: loc.latitude, lon: loc.longitude, acc: loc.accuracy, src: 'Teams API' };
  } catch (teamsErr) {
    const p = await new Promise((resolve, reject) => {
      if (!navigator.geolocation) return reject(new Error('Geolocation unavailable here.'));
      navigator.geolocation.getCurrentPosition(resolve, e => reject(new Error(e.message)),
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
    });
    return {
      lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy,
      src: 'Browser API' + (inTeams ? ' (Teams API failed)' : '')
    };
  }
}

function accClass(a) { return a <= 50 ? 'good' : a <= MAX_ACCURACY ? 'marginal' : 'bad'; }
function reset(btn) { btn.disabled = false; btn.textContent = 'Check in'; }
function show(t) { $('log').hidden = false; $('log').textContent = t; }
function fail(head, note) {
  $('stage').textContent = 'Stopped';
  $('headline').textContent = head;
  $('headline').className = 'headline bad';
  $('note').textContent = note;
}
</script>
</body>
</html>
