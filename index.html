<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attendance</title>
<script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js"></script>
<style>
  :root {
    --bg:     #ffffff;
    --panel:  #f5f6f8;
    --line:   #e1e4e9;
    --text:   #1a1d21;
    --dim:    #616a75;
    --accent: #5b5fc7;
    --good:   #0f7b3f;
    --warn:   #9a6700;
    --bad:    #b32d2e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:     #1f1f1f;
      --panel:  #2b2b2b;
      --line:   #3d3d3d;
      --text:   #e8e8e8;
      --dim:    #9aa2ad;
      --accent: #7f85f5;
      --good:   #5cc98a;
      --warn:   #e0b341;
      --bad:    #f07b7c;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px 20px 40px;
    max-width: 480px;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }

  .who { font-size: 13px; color: var(--dim); margin-bottom: 3px; }
  .day { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 26px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px 20px;
    margin-bottom: 18px;
    min-height: 108px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .state { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 5px; }
  .detail { font-size: 14px; color: var(--dim); }
  .good { color: var(--good); }
  .warn { color: var(--warn); }
  .bad  { color: var(--bad); }

  button {
    width: 100%;
    padding: 18px;
    font: 600 17px/1 inherit;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 10px;
    cursor: pointer;
  }
  button:active { filter: brightness(.9); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

  .spinner {
    display: inline-block;
    width: 15px; height: 15px;
    margin-right: 9px;
    vertical-align: -2px;
    border: 2px solid rgba(255,255,255,.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2s; }
  }

  .identify { margin-top: 26px; }
  .identify label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 6px; }
  .identify input {
    width: 100%;
    padding: 12px;
    font: 15px inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .identify input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .meta {
    margin-top: 24px;
    font-size: 12px;
    color: var(--dim);
    line-height: 1.7;
  }
</style>
</head>
<body>

<div class="who" id="who">Signing you in…</div>
<div class="day" id="day"></div>

<div class="card">
  <div class="state" id="state">Ready</div>
  <div class="detail" id="detail">Tap below when you arrive or leave.</div>
</div>

<button id="btn" disabled>Check in</button>

<div class="identify" id="identify" hidden>
  <label for="email">Work email</label>
  <input id="email" type="email" inputmode="email" autocomplete="email"
         placeholder="you@bpsme.com">
</div>

<p class="meta" id="meta"></p>

<script>
const FLOW_URL = "https://aa4be80f69d6e7d181ad5427fec619.5c.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/04/workflows/2c83c02849214eec942b78d326270572/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=42vppYo6TNDpNw6t3CXQreat6iKfOU9jzYTJMF03g2c";

const MAX_ACCURACY = 100;   // metres — must match the flow's gate

const $ = id => document.getElementById(id);
let userEmail = null;
let inTeams = false;

$('day').textContent = new Date().toLocaleDateString(undefined,
  { weekday: 'long', day: 'numeric', month: 'long' });

// ---- identify the person --------------------------------------------------

microsoftTeams.app.initialize()
  .then(() => microsoftTeams.app.getContext())
  .then(ctx => {
    inTeams = true;
    userEmail = ctx.user && (ctx.user.userPrincipalName || ctx.user.loginHint);
    const name = ctx.user && ctx.user.displayName;
    if (userEmail) {
      $('who').textContent = name || userEmail;
      ready();
    } else {
      askForEmail('Teams did not share your account.');
    }
    if (ctx.app && ctx.app.theme) applyTeamsTheme(ctx.app.theme);
    microsoftTeams.app.registerOnThemeChangeHandler(applyTeamsTheme);
  })
  .catch(() => askForEmail('Not running inside Teams.'));

function askForEmail(reason) {
  $('who').textContent = reason + ' Enter your email below.';
  $('identify').hidden = false;
  $('email').addEventListener('input', () => {
    userEmail = $('email').value.trim();
    $('btn').disabled = !userEmail.includes('@');
  });
}

function ready() { $('btn').disabled = false; }

function applyTeamsTheme(theme) {
  // Teams passes "default", "dark" or "contrast"; only dark needs forcing,
  // the rest already match the OS-level media query.
  document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
}

// ---- the check-in ---------------------------------------------------------

$('btn').addEventListener('click', run);

async function run() {
  const btn = $('btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Finding you';
  set('Locating', 'Hold still for a moment.', '');
  $('meta').textContent = '';

  let fix;
  try {
    fix = await getFix();
  } catch (e) {
    set('No location', String(e.message || e) +
        ' Check that location is switched on for Teams.', 'bad');
    resetButton(btn); return;
  }

  const acc = Math.round(fix.acc);

  if (acc > MAX_ACCURACY) {
    set('Signal too weak',
        'Your position is only accurate to about ' + acc +
        ' m. Move near a window or step outside, then try again.', 'warn');
    $('meta').textContent = fix.src;
    resetButton(btn); return;
  }

  btn.innerHTML = '<span class="spinner"></span>Recording';
  set('Sending', 'Almost done.', '');

  try {
    const res = await fetch(FLOW_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        lat: fix.lat,
        lon: fix.lon,
        accuracy: acc,
        email: userEmail,
        action: 'checkin'
      })
    });
    const text = (await res.text()).trim();

    if (res.ok) {
      set('Done', text || 'Recorded.', 'good');
      btn.textContent = 'Tap again to check out';
    } else {
      set('Not recorded', text || ('The server returned ' + res.status + '.'), 'bad');
    }
    $('meta').textContent = fix.src + ' · accurate to ' + acc + ' m';
  } catch (e) {
    set('Could not reach the server',
        'Check your connection and try again.', 'bad');
    $('meta').textContent = String(e.message || e);
  }
  btn.disabled = false;
}

async function getFix() {
  try {
    const loc = await microsoftTeams.geoLocation.getCurrentLocation();
    return { lat: loc.latitude, lon: loc.longitude, acc: loc.accuracy, src: 'Teams location' };
  } catch (teamsErr) {
    const p = await new Promise((resolve, reject) => {
      if (!navigator.geolocation) return reject(new Error('Location is unavailable here.'));
      navigator.geolocation.getCurrentPosition(resolve,
        e => reject(new Error(e.message)),
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
    });
    return {
      lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy,
      src: inTeams ? 'Device location' : 'Browser location'
    };
  }
}

function set(state, detail, cls) {
  $('state').textContent = state;
  $('state').className = 'state ' + (cls || '');
  $('detail').textContent = detail;
}

function resetButton(btn) {
  btn.disabled = false;
  btn.textContent = 'Try again';
}
</script>
</body>
</html>
